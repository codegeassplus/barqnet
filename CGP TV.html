<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة CGP الاحترافية CGP مباشر</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0e14; color: #e2e8f0; margin: 0; overflow: hidden; }
        
        .glass-header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .glass-card:active { transform: scale(0.96); background: rgba(59, 130, 246, 0.1); }
        
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .video-fixed { position: sticky; top: 0; z-index: 40; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="glass-header h-16 flex items-center justify-between px-4 fixed top-0 w-full z-50 md:static">
        <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center rounded-full bg-blue-600/20 text-blue-500">
            <i class="fas fa-bars"></i>
        </button>
        <span class="font-extrabold text-xl tracking-tight text-white">CGP <span class="text-blue-500">TV</span></span>
        <div id="connection-status" class="flex items-center gap-2 text-[10px] bg-green-500/10 text-green-500 px-2 py-1 rounded-full">
            <span class="relative flex h-2 w-2"><span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span></span>
            متصل
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden pt-16 md:pt-0">
        
        <aside id="side-menu" class="fixed inset-y-0 right-0 w-80 bg-[#0f172a] z-[60] transform translate-x-full transition-transform duration-300 ease-in-out border-l border-white/5 md:relative md:translate-x-0 flex flex-col">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-[#1e293b]/30">
                <h3 class="font-bold text-lg text-white"><i class="fas fa-layer-group ml-2 text-blue-500"></i>أقسام القنوات</h3>
                <button onclick="toggleMenu()" class="md:hidden text-gray-400"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="cats-container" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-2">
                </div>
        </aside>

        <main id="main-content" class="flex-1 flex flex-col overflow-y-auto custom-scroll relative">
            
            <div class="video-fixed">
                <div class="max-w-4xl mx-auto relative group">
                    <video id="main-player" controls playsinline class="w-full aspect-video bg-black"></video>
                    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-black/60 hidden">
                        <div class="flex flex-col items-center">
                            <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-500 border-t-transparent mb-2"></div>
                            <span id="loader-text" class="text-xs text-blue-400">جاري الاتصال بالبث...</span>
                        </div>
                    </div>
                </div>
                <div class="p-3 border-b border-white/5 bg-[#0b0e14]">
                    <h2 id="stream-title" class="text-sm font-bold text-white truncate">يرجى اختيار قناة للمشاهدة</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[10px] text-gray-500 flex items-center gap-1"><i class="fas fa-signal"></i> معالجة ذكية للتقطيع</span>
                        <span class="text-[10px] text-gray-500 flex items-center gap-1"><i class="fas fa-users"></i> مباشر</span>
                    </div>
                </div>
            </div>

            <div class="p-4 space-y-4">
                <div class="relative group max-w-2xl mx-auto">
                    <input type="text" id="search-box" onkeyup="smartSearch()" 
                           class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pr-11 pl-4 text-sm focus:border-blue-500 focus:bg-white/10 transition-all outline-none" 
                           placeholder="ابحث عن قناة بالاسم (مثلاً: beIN)...">
                    <i class="fas fa-search absolute right-4 top-4 text-gray-500 group-focus-within:text-blue-500 transition-colors"></i>
                    <div id="search-count" class="hidden absolute left-4 top-3.5 text-[10px] bg-blue-600 text-white px-2 py-1 rounded-md"></div>
                </div>

                <div id="channels-section">
                    <div class="flex items-center justify-between mb-4">
                        <h3 id="current-cat-name" class="text-xs font-bold text-blue-500 uppercase">قائمة القنوات</h3>
                        <span id="results-info" class="text-[10px] text-gray-500"></span>
                    </div>
                    
                    <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3">
                        </div>
                    
                    <div id="no-results" class="hidden py-20 text-center flex flex-col items-center">
                        <i class="fas fa-search text-4xl text-gray-700 mb-4"></i>
                        <p class="text-gray-500">عذراً، لم نجد أي قناة بهذا الاسم</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/70 z-[55] hidden"></div>

    <script>
        const API = {
            host: "http://xlion.net:8080",
            user: "747645",
            pass: "lion123123"
        };

        let allChannels = [];
        let hls = null;
        const player = document.getElementById('main-player');

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('overlay');
            const isClosed = menu.classList.contains('translate-x-full');
            
            if(isClosed) {
                menu.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                menu.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        async function getCategories() {
            try {
                const res = await fetch(`${API.host}/player_api.php?username=${API.user}&password=${API.pass}&action=get_live_categories`);
                const data = await res.json();
                renderCategories(data);
            } catch(e) { console.error("خطأ في جلب البيانات"); }
        }

        function renderCategories(data) {
            const container = document.getElementById('cats-container');
            container.innerHTML = data.map(cat => `
                <div onclick="getChannels('${cat.category_id}', '${cat.category_name}')" 
                     class="cat-btn group p-3 rounded-xl cursor-pointer hover:bg-blue-600/10 transition-all flex items-center justify-between border border-transparent hover:border-blue-500/20">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-gray-500 group-hover:text-blue-500">
                            <i class="fas fa-folder text-xs"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-300 group-hover:text-white truncate w-40">${cat.category_name}</span>
                    </div>
                    <i class="fas fa-chevron-left text-[10px] text-gray-700"></i>
                </div>
            `).join('');
        }

        async function getChannels(id, name) {
            if(window.innerWidth < 768) toggleMenu();
            
            document.getElementById('current-cat-name').innerText = name;
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '<div class="col-span-full py-10 flex justify-center"><div class="animate-spin h-8 w-8 border-4 border-blue-500 border-t-transparent rounded-full"></div></div>';

            try {
                const res = await fetch(`${API.host}/player_api.php?username=${API.user}&password=${API.pass}&action=get_live_streams&category_id=${id}`);
                allChannels = await res.json();
                renderChannels(allChannels);
            } catch(e) { grid.innerHTML = 'خطأ في التحميل'; }
        }

        function renderChannels(list) {
            const grid = document.getElementById('channels-grid');
            const noRes = document.getElementById('no-results');
            
            if(list.length === 0) {
                grid.innerHTML = '';
                noRes.classList.remove('hidden');
                return;
            }
            
            noRes.classList.add('hidden');
            grid.innerHTML = list.map(ch => `
                <div onclick="playStream('${ch.stream_id}', '${ch.name}')" 
                     class="glass-card p-2 rounded-2xl cursor-pointer hover:border-blue-500/40 fade-in">
                    <div class="aspect-video rounded-xl bg-[#000] mb-2 overflow-hidden flex items-center justify-center relative shadow-inner">
                        ${ch.stream_icon ? `<img src="${ch.stream_icon}" class="w-full h-full object-contain" onerror="this.style.display='none'">` : ''}
                        <div class="absolute inset-0 flex items-center justify-center bg-black/20 opacity-0 hover:opacity-100 transition-opacity">
                            <i class="fas fa-play-circle text-2xl text-blue-500"></i>
                        </div>
                    </div>
                    <p class="text-[10px] font-bold text-center text-gray-200 truncate px-1">${ch.name}</p>
                </div>
            `).join('');
        }

        function smartSearch() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const countLabel = document.getElementById('search-count');
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            
            if(query.length > 0) {
                countLabel.innerText = `${filtered.length} نتيجة`;
                countLabel.classList.remove('hidden');
            } else {
                countLabel.classList.add('hidden');
            }
            renderChannels(filtered);
        }

        // --- وظيفة التشغيل المطورة للمعالجة الجذرية للتقطيع ---
        function playStream(id, name) {
            const url = `${API.host}/live/${API.user}/${API.pass}/${id}.m3u8`;
            const loader = document.getElementById('loader');
            const loaderText = document.getElementById('loader-text');
            
            document.getElementById('stream-title').innerText = `بث مباشر: ${name}`;
            loader.classList.remove('hidden');
            loaderText.innerText = "جاري الاتصال بالبث...";
            
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });

            // تنظيف المشغل القديم
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,         // التخزين المؤقت لـ 30 ثانية
                    maxMaxBufferLength: 60,
                    liveSyncDurationCount: 8,    // موازنة بين السرعة والاستقرار
                    enableWorker: true,
                    manifestLoadingMaxRetry: 20,
                    manifestLoadingRetryDelay: 1000,
                    levelLoadingMaxRetry: 20,
                    levelLoadingRetryDelay: 1000
                });

                hls.loadSource(url);
                hls.attachMedia(player);

                // معالجة الأخطاء تلقائياً
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        loader.classList.remove('hidden');
                        loaderText.innerText = "جاري معالجة التقطيع تلقائياً...";
                        
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                playStream(id, name);
                                break;
                        }
                    }
                });

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.play().catch(() => {
                        console.log("يجب التفاعل مع الصفحة لتشغيل الصوت");
                    });
                    loader.classList.add('hidden');
                });

            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                // لأجهزة Safari
                player.src = url;
                player.addEventListener('loadedmetadata', () => {
                    player.play();
                    loader.classList.add('hidden');
                });
            }
        }

        window.onload = getCategories;
    </script>
</body>
</html>
