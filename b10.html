<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل القنوات المباشرة</title>

    <!-- Tailwind CSS للتنسيق العصري -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- مكتبة HLS.js لتشغيل روابط m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- مكتبة FLV.js لتشغيل روابط flv -->
    <script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- قائمة القنوات (الجانب الأيمن) -->
    <aside class="w-full md:w-80 lg:w-96 bg-slate-900 border-l border-slate-800 flex flex-col h-1/2 md:h-full z-10">
        <!-- الهيدر والبحث -->
        <div class="p-4 border-b border-slate-800 bg-slate-900/50 backdrop-blur">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2 mb-3">
                <i class="fa-solid fa-tv"></i> القنوات المباشرة
            </h1>
            <div class="relative">
                <input type="text" id="searchInput" placeholder="ابحث عن قناة..." 
                    class="w-full bg-slate-800 text-sm text-slate-200 placeholder-slate-400 rounded-lg pr-9 pl-4 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500 transition">
                <i class="fa-solid fa-search absolute right-3 top-2.5 text-slate-400 text-sm"></i>
            </div>
        </div>

        <!-- قائمة القنوات -->
        <div id="channelsList" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
            <div class="text-center text-slate-500 py-8 flex flex-col items-center gap-2">
                <i class="fa-solid fa-spinner animate-spin text-2xl text-indigo-500"></i>
                <span id="loadingStateText">جاري الاتصال بالسيرفر...</span>
            </div>
        </div>
    </aside>

    <!-- منطقة المشغل (الجانب الأيسر) -->
    <main class="flex-1 flex flex-col bg-slate-950 h-1/2 md:h-full overflow-y-auto custom-scrollbar">
        <!-- شاشة الفيديو -->
        <div class="w-full bg-black aspect-video max-h-[70vh] flex items-center justify-center relative group">
            <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
            <div id="statusOverlay" class="absolute inset-0 bg-slate-950/80 flex flex-col items-center justify-center gap-3">
                <i class="fa-solid fa-circle-play text-5xl text-indigo-500 animate-pulse"></i>
                <p id="statusText" class="text-slate-300 font-medium">اختر قناة لبدء البث</p>
            </div>
        </div>

        <!-- تفاصيل القناة والجودات -->
        <div class="p-4 md:p-6 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div>
                    <h2 id="currentChannelName" class="text-2xl font-bold text-white">اختر قناة</h2>
                    <span id="currentChannelCategory" class="inline-block mt-1 text-xs px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-full font-semibold border border-indigo-500/20">--</span>
                </div>
            </div>

            <!-- خيارات الجودة والبروتوكولات -->
            <div>
                <h3 class="text-sm font-semibold text-slate-400 mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> الجودة المتاحة:
                </h3>
                <div id="qualitiesList" class="flex flex-wrap gap-2">
                    <span class="text-slate-500 text-sm">لم يتم تحديد قناة بعد</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const ORIGINAL_URL = "http://89.117.50.191:8991/static/channels.json";
        
        // مسارات متعددة للجلب لضمان النجاح 100%
        const PROXIES = [
            ORIGINAL_URL, // تجربة الاتصال المباشر أولاً
            `https://corsproxy.io/?${encodeURIComponent(ORIGINAL_URL)}`,
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(ORIGINAL_URL)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(ORIGINAL_URL)}`
        ];
        
        let allChannels = [];
        let currentHls = null;
        let currentFlv = null;
        let selectedChannel = null;

        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const statusText = document.getElementById('statusText');

        // 1. محاولات جلب متتابعة وذكية
        async function fetchChannels() {
            const loadingText = document.getElementById('loadingStateText');
            let data = null;

            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    if (loadingText) loadingText.innerText = `جاري جلب القنوات (المحاولة ${i + 1})...`;
                    
                    const response = await fetch(PROXIES[i]);
                    if (!response.ok) throw new Error("فشل الاتصال");
                    
                    // التعامل مع اختلاف صياغة الاستجابة بين البروكسيات
                    const textData = await response.text();
                    data = typeof textData === 'string' ? JSON.parse(textData) : textData;
                    
                    if (data && data.channels) break; // تم نجاح الجلب!
                } catch (err) {
                    console.warn(`فشلت المحاولة ${i + 1}، جاري التجربة بواسطة المسار البديل...`);
                }
            }

            if (data && data.channels) {
                // تصفية جودات mp4 و ZeroLAG
                allChannels = data.channels.map(channel => {
                    const filteredQualities = (channel.qualities || []).filter(q => {
                        const playerType = (q.player || '').toLowerCase();
                        const nameType = (q.name || '').toLowerCase();
                        return playerType !== 'mp4' && nameType !== 'zerolag';
                    });
                    return { ...channel, qualities: filteredQualities };
                });

                renderChannels(allChannels);
            } else {
                showError();
            }
        }

        function showError() {
            document.getElementById('channelsList').innerHTML = `
                <div class="text-center text-rose-500 py-8 px-4">
                    <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
                    <p class="font-semibold">تعذر جلب البيانات من السيرفر</p>
                    <p class="text-xs text-slate-400 mt-2">سبب المشكلة: المتصفح يمنع قراءة ملفات HTTP من هذا النطاق تلقائياً لحمايتك.</p>
                </div>
            `;
        }

        // 2. عرض القنوات
        function renderChannels(channelsToRender) {
            const listContainer = document.getElementById('channelsList');
            listContainer.innerHTML = '';

            if (channelsToRender.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-slate-500 py-8">لا توجد قنوات متاحة</div>`;
                return;
            }

            channelsToRender.forEach(channel => {
                if (!channel.is_active) return;

                const btn = document.createElement('button');
                btn.className = `w-full text-right p-3 rounded-xl transition flex items-center justify-between border ${selectedChannel?.id === channel.id ? 'bg-indigo-600/20 border-indigo-500 text-white' : 'bg-slate-800/50 border-slate-700/50 text-slate-300 hover:bg-slate-800'}`;
                
                btn.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg bg-slate-700 flex items-center justify-center text-xs font-bold text-indigo-400">
                            ${channel.name.substring(0, 2)}
                        </div>
                        <div>
                            <div class="font-medium text-sm">${channel.name}</div>
                            <div class="text-xs text-slate-400">${channel.channel_type_display}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-500"></i>
                `;

                btn.onclick = () => selectChannel(channel);
                listContainer.appendChild(btn);
            });
        }

        // 3. اختيار القناة
        function selectChannel(channel) {
            selectedChannel = channel;
            renderChannels(allChannels);

            document.getElementById('currentChannelName').innerText = channel.name;
            document.getElementById('currentChannelCategory').innerText = channel.channel_type_display;

            const qualitiesList = document.getElementById('qualitiesList');
            qualitiesList.innerHTML = '';

            if (!channel.qualities || channel.qualities.length === 0) {
                qualitiesList.innerHTML = `<span class="text-amber-500 text-sm">لا توجد جودات مدعومة لهذه القناة</span>`;
                return;
            }

            channel.qualities.forEach((q, index) => {
                if(!q.is_active) return;

                const qBtn = document.createElement('button');
                qBtn.className = 'quality-btn px-4 py-2 rounded-lg text-sm font-semibold border bg-slate-800 border-slate-700 hover:border-indigo-500 hover:bg-indigo-500/10 transition';
                qBtn.innerText = `${q.name} (${q.player.toUpperCase()})`;
                
                qBtn.onclick = () => {
                    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('border-indigo-500', 'bg-indigo-500/20', 'text-indigo-400'));
                    qBtn.classList.add('border-indigo-500', 'bg-indigo-500/20', 'text-indigo-400');
                    playStream(q.url, q.player);
                };

                qualitiesList.appendChild(qBtn);

                if(index === 0) qBtn.click();
            });
        }

        // 4. تشغيل البث
        function playStream(url, playerType) {
            if (currentHls) { currentHls.destroy(); currentHls = null; }
            if (currentFlv) { currentFlv.destroy(); currentFlv = null; }
            
            statusOverlay.classList.remove('hidden');
            statusText.innerText = 'جاري التحميل...';

            const type = playerType.toLowerCase();

            // HLS
            if (type === 'hls' || url.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    currentHls = new Hls();
                    currentHls.loadSource(url);
                    currentHls.attachMedia(video);
                    currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play();
                        statusOverlay.classList.add('hidden');
                    });
                    currentHls.on(Hls.Events.ERROR, () => {
                        statusText.innerText = 'عذراً، تعذر تشغيل هذا البث حالياً';
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = url;
                    video.play();
                    statusOverlay.classList.add('hidden');
                }
            } 
            // FLV
            else if (type === 'flv' || url.includes('.flv')) {
                if (flvjs.isSupported()) {
                    currentFlv = flvjs.createPlayer({ type: 'flv', url: url });
                    currentFlv.attachMediaElement(video);
                    currentFlv.load();
                    currentFlv.play();
                    statusOverlay.classList.add('hidden');
                } else {
                    statusText.innerText = 'متصفحك لا يدعم مشغل FLV';
                }
            }
        }

        // 5. البحث
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allChannels.filter(c => 
                c.name.toLowerCase().includes(term) || 
                c.channel_type_display.toLowerCase().includes(term)
            );
            renderChannels(filtered);
        });

        // بدء الجلب فور التحميل
        window.addEventListener('DOMContentLoaded', fetchChannels);
    </script>
</body>
</html>
