<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> القيصر  | </title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        * { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0b0e14; color: #e2e8f0; margin: 0; overflow: hidden; }
        
        /*   */
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .glass-card:active { transform: scale(0.96); background: rgba(59, 130, 246, 0.1); }
        
        /*   */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /*     */
        .video-fixed { position: sticky; top: 0; z-index: 40; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .cat-btn-active { background: #2563eb !important; color: white !important; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="glass-header h-16 flex items-center justify-between px-4 fixed top-0 w-full z-50">
        <div class="flex items-center gap-3">
            <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-blue-600/10 text-blue-500 hover:bg-blue-600 hover:text-white transition-all">
                <i class="fas fa-bars-staggered"></i>
            </button>
            <span class="font-extrabold text-xl tracking-tight text-white italic">القيصر<span class="text-blue-500 font-light">LIVE</span></span>
        </div>
        <div class="flex items-center gap-2 text-[10px] bg-green-500/10 text-green-500 px-3 py-1.5 rounded-full border border-green-500/20">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
            </span>
             
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden pt-16">
        
        <aside id="side-menu" class="fixed inset-y-0 right-0 w-72 bg-[#0f172a] z-[60] transform translate-x-full transition-transform duration-300 ease-in-out border-l border-white/5 md:relative md:translate-x-0 flex flex-col shadow-2xl">
            <div class="p-5 border-b border-white/5 flex justify-between items-center bg-[#1e293b]/30">
                <h3 class="font-bold text-md text-white"><i class="fas fa-list-ul ml-2 text-blue-500"></i></h3>
                <button onclick="toggleMenu()" class="md:hidden text-gray-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="cats-container" class="flex-1 overflow-y-auto custom-scroll p-3 space-y-1">
                <div class="animate-pulse space-y-2 p-2">
                    <div class="h-10 bg-white/5 rounded-lg"></div>
                    <div class="h-10 bg-white/5 rounded-lg"></div>
                    <div class="h-10 bg-white/5 rounded-lg"></div>
                </div>
            </div>
        </aside>

        <main id="main-content" class="flex-1 flex flex-col overflow-y-auto custom-scroll relative bg-[#0b0e14]">
            
            <div class="video-fixed">
                <div class="max-w-5xl mx-auto relative group">
                    <video id="main-player" controls playsinline class="w-full aspect-video bg-black shadow-2xl"></video>
                    <div id="loader" class="absolute inset-0 flex items-center justify-center bg-black/80 hidden">
                        <div class="flex flex-col items-center">
                            <div class="animate-spin rounded-full h-10 w-10 border-2 border-blue-500 border-t-transparent mb-3"></div>
                            <span id="loader-text" class="text-[10px] uppercase tracking-widest text-blue-400 font-bold">  ...</span>
                        </div>
                    </div>
                </div>
                <div class="p-3 border-b border-white/5 bg-[#0f172a]/80 backdrop-blur-md">
                    <h2 id="stream-title" class="text-xs font-bold text-white truncate"> ..   </h2>
                    <div class="flex items-center gap-3 mt-1.5">
                        <span class="text-[9px] bg-blue-600/20 text-blue-400 px-2 py-0.5 rounded flex items-center gap-1">
                            <i class="fas fa-bolt"></i> Ultra HD
                        </span>
                        <span class="text-[9px] text-gray-500 flex items-center gap-1">
                            <i class="fas fa-eye"></i>  
                        </span>
                    </div>
                </div>
            </div>

            <div class="p-4 space-y-4">
                <div class="relative group max-w-xl mx-auto">
                    <input type="text" id="search-box" onkeyup="smartSearch()" 
                           class="w-full bg-white/5 border border-white/10 rounded-xl py-3 pr-10 pl-4 text-xs focus:border-blue-500 focus:bg-white/10 transition-all outline-none" 
                           placeholder="    ...">
                    <i class="fas fa-search absolute right-3.5 top-3.5 text-gray-500 group-focus-within:text-blue-500"></i>
                    <div id="search-count" class="hidden absolute left-3 top-2.5 text-[9px] bg-blue-600 text-white px-2 py-1 rounded"></div>
                </div>

                <div id="channels-section">
                    <div class="flex items-center justify-between mb-4 px-1">
                        <h3 id="current-cat-name" class="text-[11px] font-black text-gray-400 uppercase tracking-widest"> </h3>
                        <span id="results-info" class="text-[10px] text-blue-500 font-bold"></span>
                    </div>
                    
                    <div id="channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                        </div>
                    
                    <div id="no-results" class="hidden py-20 text-center flex flex-col items-center">
                        <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4">
                            <i class="fas fa-search-minus text-2xl text-gray-600"></i>
                        </div>
                        <p class="text-gray-500 text-sm">       </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/80 z-[55] hidden backdrop-blur-sm"></div>

    <script>
        //   (  )
        const API = {
            host: "http://cdn-u.me:2095",
            user: "3UEZYTfXIU",
            pass: "X9lnlmXZRJ"
        };

        let allChannels = [];
        let hls = null;
        const player = document.getElementById('main-player');

        function toggleMenu() {
            const menu = document.getElementById('side-menu');
            const overlay = document.getElementById('overlay');
            const isClosed = menu.classList.contains('translate-x-full');
            
            if(isClosed) {
                menu.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                menu.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        async function getCategories() {
            try {
                const res = await fetch(`${API.host}/player_api.php?username=${API.user}&password=${API.pass}&action=get_live_categories`);
                const data = await res.json();
                renderCategories(data);
                //    
                if(data.length > 0) getChannels(data[0].category_id, data[0].category_name);
            } catch(e) { console.error("API Error"); }
        }

        function renderCategories(data) {
            const container = document.getElementById('cats-container');
            container.innerHTML = data.map(cat => `
                <div onclick="getChannels('${cat.category_id}', '${cat.category_name}', this)" 
                     class="cat-item group p-3 rounded-lg cursor-pointer hover:bg-white/5 transition-all flex items-center justify-between border border-transparent">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-folder text-[10px] text-blue-500/50 group-hover:text-blue-500"></i>
                        <span class="text-[13px] font-medium text-gray-400 group-hover:text-white truncate w-44">${cat.category_name}</span>
                    </div>
                    <i class="fas fa-angle-left text-[9px] text-gray-700"></i>
                </div>
            `).join('');
        }

        async function getChannels(id, name, element) {
            if(window.innerWidth < 768) toggleMenu();
            
            //    
            document.querySelectorAll('.cat-item').forEach(el => el.classList.remove('cat-btn-active'));
            if(element) element.classList.add('cat-btn-active');

            document.getElementById('current-cat-name').innerText = name;
            const grid = document.getElementById('channels-grid');
            grid.innerHTML = '<div class="col-span-full py-10 flex justify-center"><div class="animate-spin h-6 w-6 border-2 border-blue-500 border-t-transparent rounded-full"></div></div>';

            try {
                const res = await fetch(`${API.host}/player_api.php?username=${API.user}&password=${API.pass}&action=get_live_streams&category_id=${id}`);
                allChannels = await res.json();
                renderChannels(allChannels);
            } catch(e) { grid.innerHTML = '   '; }
        }

        function renderChannels(list) {
            const grid = document.getElementById('channels-grid');
            const noRes = document.getElementById('no-results');
            
            if(list.length === 0) {
                grid.innerHTML = '';
                noRes.classList.remove('hidden');
                return;
            }
            
            noRes.classList.add('hidden');
            grid.innerHTML = list.map(ch => `
                <div onclick="playStream('${ch.stream_id}', '${ch.name}')" 
                     class="glass-card p-2 rounded-xl cursor-pointer hover:border-blue-500/50 fade-in relative group overflow-hidden">
                    <div class="aspect-video rounded-lg bg-black/40 mb-2 overflow-hidden flex items-center justify-center relative shadow-inner">
                        ${ch.stream_icon ? `<img src="${ch.stream_icon}" class="w-full h-full object-contain p-1" onerror="this.style.display='none'">` : '<i class="fas fa-tv text-gray-800 text-xl"></i>'}
                        <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <i class="fas fa-play text-white shadow-xl"></i>
                        </div>
                    </div>
                    <p class="text-[10px] font-bold text-center text-gray-300 truncate px-1">${ch.name}</p>
                </div>
            `).join('');
        }

        function smartSearch() {
            const query = document.getElementById('search-box').value.toLowerCase();
            const countLabel = document.getElementById('search-count');
            const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
            
            if(query.length > 0) {
                countLabel.innerText = `${filtered.length} `;
                countLabel.classList.remove('hidden');
            } else {
                countLabel.classList.add('hidden');
            }
            renderChannels(filtered);
        }

        function playStream(id, name) {
            const url = `${API.host}/live/${API.user}/${API.pass}/${id}.m3u8`;
            const loader = document.getElementById('loader');
            
            document.getElementById('stream-title').innerText = name;
            loader.classList.remove('hidden');
            
            //    
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });

            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                hls = new Hls({
                    maxBufferLength: 30,
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(url);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    player.play();
                    loader.classList.add('hidden');
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) hls.recoverMediaError();
                });
            } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
                player.src = url;
                player.addEventListener('loadedmetadata', () => {
                    player.play();
                    loader.classList.add('hidden');
                });
            }
        }

        window.onload = getCategories;
    </script>
</body>
</html>
