<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>  مشغل المباريات المباشر</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: #0a0a0f;
  color: #f5f5f7;
  min-height: 100vh;
  direction: rtl;
  overflow-x: hidden;
}

/* ─── إجبار الوضع الأفقي الذكي للموبايل ─── */
@media screen and (orientation: portrait) {
  html, body {
    width: 100vh;
    height: 100vw;
  }
  body {
    transform: rotate(-90deg);
    transform-origin: left top;
    position: absolute;
    top: 100%;
    left: 0;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .container {
    padding: 12px !important;
  }
}

.header {
  background: linear-gradient(135deg, #1a1a24, #22222e);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #00E676, #00b0ff);
  border-radius: 10px;
  display: grid; place-items: center;
  font-size: 18px; color: #fff;
  font-weight: 900;
  flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 800; }
.header p  { font-size: 11px; color: #a0a0b0; margin-top: 1px; }

.container { 
  max-width: 100%; 
  margin: 0 auto; 
  padding: 20px 30px; 
}

.status-bar {
  padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 700;
  margin-bottom: 16px; display: none; align-items: center; gap: 8px; justify-content: center;
}
.status-bar.show { display: flex; }
.status-bar.loading { background: rgba(59,130,246,.15); border: 1px solid rgba(59,130,246,.3); color: #60a5fa; }
.status-bar.error   { background: rgba(255,51,102,.12); border: 1px solid rgba(255,51,102,.3); color: #ff3366; }

.spinner {
  width: 16px; height: 16px; border: 2px solid rgba(96,165,250,.3);
  border-top-color: #60a5fa; border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── تنسيق شبكي عريض يناسب العرض الأفقي ─── */
.matches-list { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(440px, 1fr)); 
  gap: 16px; 
}

@media (max-width: 500px) {
  .matches-list {
    grid-template-columns: 1fr;
  }
}

.match-item {
  background: #1a1a24;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.match-item:hover {
  background: #20202c;
  border-color: #00b0ff;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0, 176, 255, 0.15);
}

.match-versus-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 0;
}
.team-box {
  flex: 1; font-size: 15px; font-weight: 700; color: #ffffff;
  display: flex; align-items: center; gap: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.team-box.home { justify-content: flex-start; text-align: right; }
.team-box.away { justify-content: flex-end; text-align: left; direction: ltr; }
.team-name { display: inline-block; overflow: hidden; text-overflow: ellipsis; }

.team-logo {
  width: 28px; height: 28px; object-fit: contain;
  background: rgba(255,255,255,0.03); border-radius: 6px; padding: 2px;
}

.vs-badge {
  background: #12121a; padding: 5px 12px; border-radius: 20px;
  font-size: 14px; font-weight: 800; color: #00b0ff;
  border: 1px solid rgba(255,255,255,0.05); min-width: 70px; text-align: center;
  display: flex; justify-content: center; gap: 6px;
}
.score-num { color: #fff; font-weight: 900; }
.score-vs { color: #00b0ff; font-size: 11px; font-weight: 400; }

.match-details-meta {
  display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; color: #a0a0b0;
  border-top: 1px solid rgba(255,255,255,0.04); padding-top: 8px;
}
.meta-tag { background: rgba(255,255,255,0.04); padding: 3px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; }

.match-footer-row { display: flex; justify-content: space-between; align-items: center; }
.match-badge {
  font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 20px;
  background: rgba(0, 176, 255, 0.15); color: #00b0ff;
}
.match-badge.live { background: rgba(0, 230, 118, 0.15); color: #00E676; }
.match-badge.finished { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
.match-badge.not-started { background: rgba(255, 176, 0, 0.15); color: #ffb000; }

.match-action-btn { font-size: 12px; font-weight: 700; color: #00E676; display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">⚽</div>
  <div>
    <h1>  جدول البث المباشر المطور</h1>
    <p>واجهة تشغيل أفقية ذكية - اختر مباراتك المفضلة لبدء البث المباشر</p>
  </div>
</div>

<div class="container">

  <!-- شريط المتابعة والاتصال الصامت بالسيرفر -->
  <div class="status-bar" id="globalStatus"></div>

  <!-- حاوية عرض كروت المباريات المحسن للوضع الأفقي -->
  <div class="matches-list" id="matchesList"></div>

</div>

<script>
const CONFIG = {
  panelApi: "https://panel.joaantv.workers.dev",
  networkKey: "demo"
};

let G = {
  matchesApi: '',
  rawJson: null
};

// تشغيل وطلب قفل التدوير برمجياً للهواتف المتوافقة لدعم العرض الأفقي المباشر
window.addEventListener('DOMContentLoaded', () => {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => { /* حماية للمتصفحات القديمة */ });
  }
  startPipelineWithRetry(1, 3);
});

async function startPipelineWithRetry(attempt, maxAttempts) {
  showStatus('globalStatus', 'loading', `جاري جلب تحديث المباريات... (محاولة ${attempt})`);
  
  try {
    const url = `${CONFIG.panelApi}/api/public/config?network=${encodeURIComponent(CONFIG.networkKey)}`;
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error();
    const data = await res.json();
    if (!data.ok) throw new Error();

    G.matchesApi = (data.config?.matches?.apiUrl || data.config?.matchesApiUrl || '').trim();
    if (!G.matchesApi) throw new Error();

    const resMatches = await fetch(G.matchesApi, { cache: 'no-store' });
    if (!resMatches.ok) throw new Error();
    G.rawJson = await resMatches.json();
    
    processMatches();
    document.getElementById('globalStatus').style.display = 'none'; 
    
  } catch (error) {
    if (attempt < maxAttempts) {
      setTimeout(() => {
        startPipelineWithRetry(attempt + 1, maxAttempts);
      }, 500);
    } else {
      showStatus('globalStatus', 'error', '✗ فشل جلب البيانات الحالية، يرجى تحديث الصفحة.');
    }
  }
}

function processMatches() {
  if (!G.rawJson) return;

  const listContainer = document.getElementById('matchesList');
  listContainer.innerHTML = ''; 

  const matches = Array.isArray(G.rawJson.today) ? G.rawJson.today : [];
  let counter = 0;

  matches.forEach(match => {
    let rawUrl = match.link || match.url || '';
    if (!rawUrl) return;

    let realUrl = '';
    if (rawUrl.startsWith('joaantv://')) {
      try {
        const urlObj = new URL(rawUrl);
        const itemsParam = urlObj.searchParams.get('items');
        if (itemsParam) {
          const decodedItems = JSON.parse(decodeURIComponent(itemsParam));
          if (Array.isArray(decodedItems) && decodedItems.length > 0) {
            realUrl = decodedItems[0].url || '';
          }
        }
      } catch (err) { realUrl = rawUrl; }
    } else { realUrl = rawUrl; }

    const rightTeam = match["Team-Right"] || {};
    const leftTeam = match["Team-Left"] || {};

    const team1 = rightTeam.Name || 'الفريق الأول';
    const team1Logo = rightTeam.Logo || '';
    const team1Goal = rightTeam.Goal !== undefined && rightTeam.Goal !== null ? rightTeam.Goal : 0;

    const team2 = leftTeam.Name || 'الفريق الثاني';
    const team2Logo = leftTeam.Logo || '';
    const team2Goal = leftTeam.Goal !== undefined && leftTeam.Goal !== null ? leftTeam.Goal : 0;

    const league = match["Cup-Name"] || 'بطولة عامة';
    const channel = match["Tv"] || 'غير محددة';
    const commentator = match["Mic"] || 'غير مدرج';
    const statusText = match["Status"] || 'بث مباشر';

    if (realUrl) {
      counter++;
      const matchItem = document.createElement('div');
      matchItem.className = 'match-item';
      matchItem.onclick = () => { window.open(realUrl, '_blank'); };

      let badgeClass = 'match-badge';
      if (statusText.includes('انتهت') || statusText.includes('منتهية')) {
        badgeClass = 'match-badge finished';
      } else if (statusText.includes('لم تبدأ')) {
        badgeClass = 'match-badge not-started';
      } else {
        badgeClass = 'match-badge live';
      }

      let scoreHtml = '';
      if (statusText.includes('لم تبدأ')) {
        scoreHtml = `<span class="score-vs">VS</span>`;
      } else {
        scoreHtml = `
          <span class="score-num">${team1Goal}</span>
          <span class="score-vs">-</span>
          <span class="score-num">${team2Goal}</span>
        `;
      }

      matchItem.innerHTML = `
        <div class="match-footer-row">
          <span style="font-size: 11px; color: #00b0ff; font-weight: 800; background:rgba(0,176,255,0.08); padding:3px 8px; border-radius:6px;">🏆 ${league}</span>
          <span class="${badgeClass}">📡 ${statusText}</span>
        </div>
        
        <div class="match-versus-row">
          <div class="team-box home">
            ${team1Logo ? `<img class="team-logo" src="${team1Logo}" onerror="this.style.display='none'">` : '•'}
            <span class="team-name">${team1}</span>
          </div>
          <div class="vs-badge">${scoreHtml}</div>
          <div class="team-box away">
            <span class="team-name">${team2}</span>
            ${team2Logo ? `<img class="team-logo" src="${team2Logo}" onerror="this.style.display='none'">` : '•'}
          </div>
        </div>

        <div class="match-details-meta">
          <div class="meta-tag">📺 القناة: ${channel}</div>
          <div class="meta-tag">🎙️ المعلق: ${commentator}</div>
        </div>

        <div class="match-footer-row" style="margin-top: 4px; border-top: 1px dashed rgba(255,255,255,0.03); padding-top: 6px;">
          <span style="color: #a0a0b0; font-size:11px;">اضغط للاختيار وتشغيل البث المباشر</span>
          <div class="match-action-btn">شاهد الآن 🚀</div>
        </div>
      `;
      
      listContainer.appendChild(matchItem);
    }
  });

  if (counter === 0) {
    listContainer.innerHTML = `<div style="text-align:center; padding:40px; color:#a0a0b0; font-size:13px;">لا توجد مباريات مدرجة في الوقت الحالي.</div>`;
  }
}

function showStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = `status-bar show ${type}`;
  el.innerHTML = type === 'loading' ? `<div class="spinner"></div> ${msg}` : msg;
}
</script>
</body>
</html>
